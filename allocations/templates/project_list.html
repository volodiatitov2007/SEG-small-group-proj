{% extends 'base.html' %}

{% block content %}
    <h1>Projects</h1>

    <table class="table">
        <tr>
            <th>Name</th>
            <th>Created</th>
        </tr>
        {% for project in projects %}
            <tr>
                <td>{{ project.name }}</td>
                <td>{{ project.created_at|date:"j M Y" }}</td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="2">No projects yet.</td>
            </tr>
        {% endfor %}
    </table>
{% endblock %}
