{% extends 'base.html' %}

{% block content %}
  <h1>Projects</h1>
  <p><a class="btn btn-primary" href="{% url 'project_create' %}">New project</a></p>
  <table class="table">
    <tr>
      <th>Name</th>
      <th>Created</th>
      <th></th>
      <th></th>
    </tr>
    {% for project in projects %}
      <tr>
        <td><a href="{% url 'project_detail' project.id %}">{{ project.name }}</a></td>
        <td>{{ project.created_at|date:"j M Y" }}</td>
        <td><a href="{% url 'project_update' project.id %}">Edit</a></td>
        <td><a class="text-danger" href="{% url 'project_delete' project.id %}">Delete</a></td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="4">No projects yet.</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
